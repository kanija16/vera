services:
  postgres:
    image: postgres:16
    container_name: vera-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vera

    ports:
      - "5432:5432"

    volumes:
      - vera_pgdata:/var/lib/postgresql/data

volumes:
  vera_pgdata: